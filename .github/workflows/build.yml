name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Build optimized release APK
        continue-on-error: true
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          DEBUG_APK="SDPlayer-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEBUG_APK"
          ASSETS=("$DEBUG_APK")
          NOTES="SD Player ${VERSION}. The debug APK is the safe fallback."
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            RELEASE_APK="SDPlayer-${VERSION}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
            ASSETS=("$RELEASE_APK" "$DEBUG_APK")
            NOTES="SD Player ${VERSION}. Install SDPlayer-${VERSION}.apk (smaller, optimized). If it does not work, use the -debug.apk instead."
          fi
          gh release create "v${VERSION}-build${{ github.run_number }}" "${ASSETS[@]}" \
            --title "SD Player ${VERSION} (build ${{ github.run_number }})" \
            --notes "$NOTES"
